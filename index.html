<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Running Club Avignon</title>
<meta property="og:title" content="Running Club Avignon">
<meta property="og:description" content="Testings, sorties club et collaborations : inscris-toi en une minute.">
<meta name="theme-color" content="#17161D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Raleway:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ====== Charte Running Conseil ====== */
:root{
  --blue:#009FE3; --blue-d:#0084BF; --blue-l:#E3F5FD;
  --ink:#22212B; --black:#17161D; --text:#333333; --grey:#73737A; --grey-l:#9a9aa0;
  --bg:#F3F3F4; --paper:#FFFFFF; --line:#E4E4E7; --soft:#ECECEC;
  --red:#FD000A; --red-l:#FFE5E6; --lime:#C3E236; --lime-l:#F3F9D7;
  --ok:#2E8B3E; --ok-l:#E3F4E6; --warn:#B26B00; --warn-l:#FFF1D6;
  --r:10px; --sh:0 1px 2px rgba(23,22,29,.05),0 6px 18px rgba(23,22,29,.06);
  --fh:'Raleway',Helvetica,Arial,sans-serif; --fb:'Open Sans',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--fb);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-d)}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

/* Header */
header.top{background:var(--black);color:#fff;position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.logo{height:30px;width:auto;display:block}
.logo-fb{font:800 18px/1 var(--fh);letter-spacing:-.3px}
.logo-fb b{color:var(--blue)}
.brand-sep{width:1px;height:28px;background:#3a3944}
.brand-app{font:800 13px/1.15 var(--fh);text-transform:uppercase;letter-spacing:.8px}
.brand-app small{display:block;font:500 11px var(--fb);letter-spacing:.2px;text-transform:none;color:#a9a9b2}
.top nav{margin-left:auto;display:flex;gap:6px}
.navbtn{background:none;border:0;color:#d6d6dc;font:700 12.5px var(--fh);text-transform:uppercase;letter-spacing:.8px;padding:8px 10px;border-radius:6px;cursor:pointer}
.navbtn.on,.navbtn:hover{color:#fff;background:#2a2934}
.topline{background:#fff;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--grey);text-align:center;padding:6px 12px}
.topline b{color:var(--ink)}
#demo{background:var(--lime);color:var(--ink);font-size:12.5px;text-align:center;padding:6px 12px;font-weight:600}

main{padding:22px 0 40px;min-height:60vh}

/* Titres façon site RC */
.kicker{font:700 12px var(--fh);text-transform:uppercase;letter-spacing:2px;color:var(--grey-l);margin:0 0 4px}
.h1{font:900 30px/1.1 var(--fh);text-transform:uppercase;color:var(--ink);margin:0 0 6px;letter-spacing:-.2px}
.h1 u{text-decoration:none;box-shadow:inset 0 -5px 0 var(--blue)}
.h2{font:800 22px/1.2 var(--fh);color:var(--ink);margin:0}
.lead{color:var(--grey);margin:6px 0 0;max-width:620px}
.hero{margin-bottom:18px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:6px;padding:11px 18px;font:800 13px var(--fh);text-transform:uppercase;letter-spacing:.8px;cursor:pointer;text-decoration:none;transition:background .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-d)}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{background:#000}
.btn-ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}.btn-ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn-sm{padding:7px 11px;font-size:11.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-block{width:100%}
.back{background:none;border:0;padding:0;margin:0 0 14px;color:var(--grey);font:700 12px var(--fh);text-transform:uppercase;letter-spacing:1px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.back:hover{color:var(--ink)}

/* Barre d'outils */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 16px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:6px;font:700 12.5px var(--fh);text-transform:uppercase;letter-spacing:.6px;color:var(--grey);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.seg button small{font:600 11px var(--fb);opacity:.7;margin-left:4px}
.select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-size:13.5px}

/* Cartes */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.list{display:grid;gap:12px}
.tcard{display:flex;gap:16px;padding:16px;cursor:pointer;transition:border-color .15s,transform .15s;outline:none;position:relative;overflow:hidden}
.tcard:hover,.tcard:focus-visible{border-color:var(--blue)}
.tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.tcard.past::before{background:var(--soft)}
.tcard.past{opacity:.85}
.dateblk{width:58px;flex:none;text-align:center;padding-top:2px}
.dateblk .w{font:700 11px var(--fh);text-transform:uppercase;letter-spacing:1px;color:var(--grey)}
.dateblk .d{font:900 34px/1 var(--fh);color:var(--ink);margin:2px 0}
.dateblk .m{font:800 12px var(--fh);text-transform:uppercase;letter-spacing:1px;color:var(--blue-d)}
.tbody{flex:1;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font:800 10.5px var(--fh);text-transform:uppercase;letter-spacing:.8px;padding:4px 8px;border-radius:4px;background:var(--blue);color:#fff;white-space:nowrap}
.pill.out{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.pill.lime{background:var(--blue);color:#fff}
.pill.grey{background:var(--soft);color:var(--grey)}
.pill.red{background:var(--red);color:#fff}
.pill.dark{background:var(--ink);color:#fff}
.tcard h3{font:800 18px/1.25 var(--fh);color:var(--ink);margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:3px 14px;color:var(--grey);font-size:13.5px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.ico{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.places{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;font-weight:600}
.bar{flex:0 0 120px;height:6px;background:var(--soft);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}
.places.warn{color:var(--warn)}.places.warn .bar i{background:#F2A400}
.places.full{color:var(--red)}.places.full .bar i{background:var(--red)}
.places.muted{color:var(--grey)}
.empty{text-align:center;padding:40px 20px;color:var(--grey)}
.empty b{display:block;font:800 18px var(--fh);color:var(--ink);margin-bottom:4px}

/* Détail */
.detail{padding:0;overflow:hidden}
.dhead{background:var(--ink);color:#fff;padding:22px 22px 20px;position:relative}
.dhead::after{content:"";position:absolute;left:22px;bottom:0;width:60px;height:4px;background:var(--blue)}
.dhead .when{font:700 13px var(--fh);text-transform:uppercase;letter-spacing:1.2px;color:var(--blue)}
.dhead h2{font:900 26px/1.15 var(--fh);margin:6px 0 10px;text-transform:uppercase}
.dbody{padding:20px 22px 24px}
.infos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 22px;margin-bottom:18px}
.info{display:flex;gap:10px}
.info .ico{width:18px;height:18px;color:var(--blue);margin-top:2px}
.info .k{font:700 11px var(--fh);text-transform:uppercase;letter-spacing:1px;color:var(--grey-l)}
.info .v{color:var(--ink);font-weight:500}
.info .v a{font-size:13px;font-weight:600}
.desc{white-space:pre-line;border-top:1px solid var(--line);padding-top:16px;margin-bottom:16px}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:18px}
.notice{border-radius:8px;padding:10px 12px;font-size:13.5px;margin:0 0 14px}
.notice.warn{background:var(--warn-l);color:#6b4300}
.notice.bad{background:var(--red-l);color:#8a0006}
.notice.info{background:var(--blue-l);color:#004a6e}

/* Formulaires */
.form{padding:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.full{grid-column:1/-1}
.field label{display:block;font:700 11.5px var(--fh);text-transform:uppercase;letter-spacing:.9px;color:var(--ink);margin-bottom:5px}
.field label i{color:var(--blue);font-style:normal}
.field input:not([type=checkbox]),.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:7px;padding:10px 11px;background:#fff;font-size:15px;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue)}
.field textarea{min-height:84px;resize:vertical}
.field .hint{font-size:12px;color:var(--grey);margin-top:4px}
fieldset{border:0;padding:0;margin:0 0 20px}
legend{font:800 13px var(--fh);text-transform:uppercase;letter-spacing:1.2px;color:var(--blue-d);margin-bottom:10px;padding:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin:10px 0;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--blue);flex:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.formfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}

/* Confirmation */
.done{text-align:center;padding:34px 22px}
.done .big{width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;margin:0 auto 14px}
.done .big.wait{background:#F2A400}
.done .big .ico{width:32px;height:32px;stroke-width:3}
.recap{display:inline-grid;text-align:left;gap:6px;background:var(--bg);border-radius:8px;padding:12px 16px;margin:16px 0;font-size:14px}

/* Admin */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat{padding:14px 16px}
.stat .n{font:900 28px/1 var(--fh);color:var(--ink)}
.stat .n small{font-size:15px;color:var(--grey)}
.stat .l{font:700 11px var(--fh);text-transform:uppercase;letter-spacing:1px;color:var(--grey);margin-top:6px}
.stat.accent{background:var(--ink);border-color:var(--ink)}.stat.accent .n{color:#fff}.stat.accent .l{color:var(--blue)}
.arow{display:flex;gap:14px;align-items:center;padding:12px 14px}
.arow .dateblk{width:48px}.arow .dateblk .d{font-size:26px}
.arow .grow{flex:1;min-width:0}
.arow b.t{font:800 15.5px var(--fh);color:var(--ink);display:block;margin-bottom:2px}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.prow{display:flex;gap:12px;padding:12px 14px;align-items:flex-start;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .grow{flex:1;min-width:0}
.prow b{color:var(--ink)}
.prow .note{font-size:13px;color:var(--grey);font-style:italic;margin-top:3px}
.pact{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pres{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pres button{border:0;background:#fff;padding:6px 10px;font:700 11px var(--fh);text-transform:uppercase;letter-spacing:.5px;color:var(--grey);cursor:pointer}
.pres button+button{border-left:1px solid var(--line)}
.pres button.on.oui{background:var(--ok);color:#fff}
.pres button.on.non{background:var(--red);color:#fff}
.mini{font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
.groupt{font:800 12px var(--fh);text-transform:uppercase;letter-spacing:1.2px;color:var(--grey);padding:12px 14px 4px;background:var(--bg);border-top:1px solid var(--line)}
.bars{display:grid;gap:8px}
.hbar{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:13.5px}
.hbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.hbar .trk{height:10px;background:var(--soft);border-radius:9px;overflow:hidden}
.hbar .trk i{display:block;height:100%;background:var(--blue);border-radius:9px}
.hbar .num{text-align:right;font-weight:700;color:var(--ink)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pad{padding:16px 18px}
.h3{font:800 14px var(--fh);text-transform:uppercase;letter-spacing:1px;color:var(--ink);margin:0 0 12px}

/* Divers */
footer{border-top:1px solid var(--line);background:#fff;color:var(--grey);font-size:12.5px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px;flex-wrap:wrap}
footer button{background:none;border:0;color:var(--grey);font:700 12px var(--fh);text-transform:uppercase;letter-spacing:.8px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
footer button:hover{color:var(--ink)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
.modal{position:fixed;inset:0;background:rgba(23,22,29,.55);display:grid;place-items:center;z-index:40;padding:16px}
.modal .card{width:min(560px,100%);padding:18px}
.modal textarea{width:100%;min-height:180px;font:12.5px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:6px;padding:8px}
.skel{height:108px;border-radius:var(--r);background:linear-gradient(90deg,#ececee 25%,#f6f6f7 50%,#ececee 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ====== Fond noir — pages publiques ====== */
body.dark{background:var(--black)}
body.dark::before{content:"";position:fixed;left:0;right:0;top:-38vh;height:138vh;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(23,22,29,.25) 0%,rgba(23,22,29,.3) 40%,rgba(23,22,29,.8) 62%,rgba(23,22,29,.95) 85%),var(--bgimg,none) 85% 47%/150% auto no-repeat}
body.dark footer{background:transparent}
@media (min-width:900px){body.dark::before{background:linear-gradient(180deg,rgba(23,22,29,.15) 0%,rgba(23,22,29,.25) 40%,rgba(23,22,29,.8) 62%,rgba(23,22,29,.95) 85%),linear-gradient(90deg,#17161D 0%,#17161D calc(100% - 90vh),rgba(23,22,29,0) calc(100% - 55vh)),var(--bgimg,none) 100% 0/auto 100% no-repeat,#17161D}}
body.dark .hero{text-shadow:0 1px 10px rgba(0,0,0,.7)}
body.dark .hero .kicker{color:#d0d0d8}
body.dark .hero .lead{color:#e2e2e8}
body.dark .h1 u{box-shadow:none}
body.dark .hero .kicker{color:#fff;font-weight:800;opacity:1;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 16px rgba(0,0,0,.9)}
body.dark .hero .lead{color:#fff;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 16px rgba(0,0,0,.9)}
body.dark header.top{border-bottom:1px solid #2b2a35}
body.dark .topline{background:#1f1e27;border-color:#2b2a35;color:#9a9aa3}
body.dark .topline b{color:#fff}
body.dark .h1,body.dark .hero .h2{color:#fff}
body.dark .kicker{color:#8d8d96}
body.dark .lead{color:#b4b4bc}
body.dark .seg{background:#22212B;border-color:#34333e}
body.dark .seg button{color:#a9a9b2}
body.dark .seg button.on{background:var(--blue);color:#fff}
body.dark .select{background:#22212B;border-color:#34333e;color:#fff}
body.dark .back{color:#a9a9b2}
body.dark .back:hover{color:#fff}
body.dark .card{border-color:transparent;box-shadow:none}
body.dark .tcard:hover,body.dark .tcard:focus-visible{box-shadow:0 0 0 2px var(--blue)}
body.dark .dhead{background:#26252f}
body.dark .skel{background:linear-gradient(90deg,#24232d 25%,#2f2e39 50%,#24232d 75%);background-size:200% 100%}
body.dark footer{background:var(--black);border-color:#2b2a35;color:#8d8d96}
body.dark footer button{color:#8d8d96}
body.dark footer button:hover{color:#fff}

/* ====== QR code ====== */
.qrwrap{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:22px;padding:20px}
.poster{background:var(--black);color:#fff;border-radius:10px;padding:22px 20px 20px;position:relative;overflow:hidden;text-align:center}
.poster::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--blue)}
.poster .pb{font:800 15px var(--fh);letter-spacing:-.2px;text-align:left}
.poster .pb b{color:var(--blue)}
.poster .pk{font:700 10px var(--fh);letter-spacing:2px;text-transform:uppercase;color:#8d8d96;text-align:left;margin:2px 0 14px}
.poster .pt{font:900 21px/1.15 var(--fh);text-transform:uppercase;margin:0 0 8px;text-align:left}
.poster .pd{font:700 12px var(--fh);letter-spacing:1px;text-transform:uppercase;color:var(--blue);text-align:left}
.poster .pl{font-size:12.5px;color:#b4b4bc;text-align:left;margin-bottom:16px}
.poster .qrbox{background:#fff;border-radius:10px;padding:10px;width:78%;margin:0 auto}
.poster .qrbox svg{display:block;width:100%;height:auto}
.poster .scan{font:900 17px var(--fh);text-transform:uppercase;letter-spacing:.5px;margin-top:14px}
.poster .scan small{display:block;font:500 12px var(--fb);color:#b4b4bc;text-transform:none;letter-spacing:0;margin-top:2px}
.linkbox{display:flex;gap:8px;margin:6px 0 14px}
.linkbox input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:7px;padding:9px 10px;font-size:13px;color:var(--grey);background:var(--bg)}
.qrbtns{display:grid;gap:8px;margin-bottom:16px}
.tips{font-size:13.5px;color:var(--grey);padding-left:18px;margin:0}
.tips li{margin:4px 0}

.mbar{padding:16px 18px;margin:0 0 18px}
.mbar .mhead{display:flex;align-items:center;gap:12px}
.mbar .mhead>div{flex:1;min-width:0}
.mbar .mhead b{display:block;font:800 16px var(--fh);color:var(--ink)}
.mbar .mhead small{display:block;font-size:13px;color:var(--grey);margin-top:2px;line-height:1.4}
.mav,.mico{width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font:900 18px var(--fh);flex:none;text-transform:uppercase}
.mico .ico{width:22px;height:22px}
.store{margin:22px 0 0}
.store .sadr{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;border-top:1px solid var(--line);padding-top:12px;font-size:13.5px;color:var(--grey);line-height:1.5}
.store .sadr b{color:var(--ink)}
.store .sbtn{display:flex;gap:8px;flex-wrap:wrap}
.loyal{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.loyal .lt{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink);margin-bottom:8px}
.loyal .lt .ico{width:18px;height:18px;color:var(--blue);flex:none}
.loyal .lt.ok .ico{color:#2e9d4f}
.loyal .bar{flex:none;width:100%;height:8px}
.pill.gold{background:#F2A400;color:#17161D}
.pill.sm{font-size:9.5px;padding:2px 6px;vertical-align:2px;margin-left:6px}
.quick{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:8px;padding:14px;margin:14px 0}
.quick>.ico{width:22px;height:22px;color:var(--blue);margin-top:2px;flex:none}
.quick>div{flex:1;min-width:0}
.quick b{font:800 15px var(--fh)}
.quick .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--grey);margin-top:4px}
.mcard h3{font:800 19px var(--fh);margin:0 0 6px}
.mcard p{font-size:14px;color:var(--grey);margin:0 0 12px}
.mtable{width:100%;border-collapse:collapse;font-size:13px}
.mtable th{font:800 11px var(--fh);text-transform:uppercase;letter-spacing:.8px;color:var(--grey);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}

/* QR code — encodeur autonome (mode octet, correction M). Algorithme d'après la norme ISO/IEC 18004. */

    M.forEach((row, j) => row.forEach((b, i) => { if (b) ctx.fillRect(x + i * px, y + j * px, px, px); }));
    return M.length;
  }

  return { encode, svg, draw };
})();

const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
function api(fn, ...args) {
  if (IS_GAS) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));

function downloadCSV(name, rows, cols) {
  const q = v => { let s = String(v ?? ''); if (/^[=@]|^[+\-](?!\d)/.test(s)) s = "'" + s; return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = '\ufeff' + [cols.map(c => q(c[1])).join(';'), ...rows.map(r => cols.map(c => q(r[c[0]])).join(';'))].join('\r\n');
  if (!downloadBlob(name, new Blob([csv], { type: 'text/csv;charset=utf-8' }))) showText('Données CSV (à copier)', csv);
}
function downloadBlob(name, blob) {
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Fichier téléchargé');
    return true;
  } catch (e) { return false; }
}

function placesInfo(t) {
  const cap = parseInt(t.capacite, 10) || 0;
  if (t.statut === 'Annulé') return { label: 'Annulé', cls: 'full', pct: null };
  if (isPast(t)) return { label: plural(t.inscrits, 'participant'), cls: 'muted', pct: null };
  if (t.statut === 'Inscriptions closes') return { label: 'Inscriptions closes', cls: 'muted', pct: cap ? t.inscrits / cap * 100 : null };
  if (!cap) return { label: `${plural(t.inscrits, 'inscrit')} · places illimitées`, cls: '', pct: null };
  const rest = cap - t.inscrits;
  if (rest <= 0) return { label: `Complet · liste d'attente${t.attente ? ` (${t.attente})` : ' ouverte'}`, cls: 'full', pct: 100 };
  return { label: `${plural(rest, 'place')} restante${rest > 1 ? 's' : ''} sur ${cap}`, cls: rest <= 3 ? 'warn' : '', pct: t.inscrits / cap * 100 };
}

  const lab = `<label for="f_${name}">${esc(label)}${req ? ' <i>*</i>' : ''}</label>`;
  let input;
  if (opts) input = `<select id="f_${name}" name="${name}" ${req ? 'required' : ''}>${opts.map(x => { const [v, l] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(v)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
  else if (type === 'textarea') input = `<textarea id="f_${name}" name="${name}" placeholder="${esc(ph)}" ${req ? 'required' : ''}>${esc(val)}</textarea>`;
  else input = `<input id="f_${name}" name="${name}" type="${type}" value="${esc(val)}" placeholder="${esc(ph)}" ${req ? 'required' : ''} ${extra}>`;
  return `<div class="field ${full ? 'full' : ''}">${lab}${input}${hint ? `<div class="hint">${esc(hint)}</div>` : ''}</div>`;
};

async function submitReg(f) {
  if (!f.checkValidity()) {
    const bad = f.querySelector(':invalid'); bad && bad.focus();
    toast(bad && bad.type === 'checkbox' ? 'Merci d\'accepter l\'utilisation de tes données.' : 'Merci de compléter les champs obligatoires.', true);
    return;
  }
  const fd = new FormData(f), p = {};
  fd.forEach((v, k) => p[k] = typeof v === 'string' ? v.trim() : v);
  p.consentRgpd = !!fd.get('consentRgpd'); p.consentPhoto = !!fd.get('consentPhoto');
  p.testingId = S.currentId;
  const btn = document.getElementById('regBtn'); btn.disabled = true; btn.textContent = 'Envoi…';
  store.set('rca_seen', 1);
  if (fd.get('remember')) store.set('rca_me', { prenom: p.prenom, nom: p.nom, email: p.email, telephone: p.telephone, dateNaissance: p.dateNaissance, club: p.club, niveau: p.niveau, allure: p.allure, pointure: p.pointure });
  else if (!isMember()) store.del('rca_me');
  const devenir = !!fd.get('devenirMembre');
  delete p.remember; delete p.devenirMembre;
  try {
    let res, memberPending = '';
    if (isMember()) { res = await api('membresRegister', S.mTok, S.currentId, p); S.fullForm = false; loadMember(); }
    else {
      res = await api('register', p);
      if (devenir) {
        try { const r = await api('membresSubscribe', Object.assign({}, p, { consentRgpd: true, source: 'inscription' })); memberPending = p.email; S.demoTok = r && r.demoToken; }
        catch (e2) { toast('Inscription OK, mais l\'adhésion membre a échoué : ' + errMsg(e2), true); }
      }
    }
    go('confirm', { lastReg: { res, prenom: p.prenom, t: curT(), memberPending } });
    loadPublic(true);
  } catch (e) {
    toast(errMsg(e), true); btn.disabled = false; btn.textContent = 'Réessayer';
  }
}

/* ---------- Organisateurs : tableau de bord ---------- */
function counts(id) {
  const ins = S.admin.inscriptions.filter(i => i.testingId === id);
  return {
    inscrits: ins.filter(i => i.statut === 'Inscrit').length,
    attente: ins.filter(i => i.statut === "Liste d'attente").length,
    presents: ins.filter(i => i.present === 'oui').length,
    absents: ins.filter(i => i.present === 'non').length
  };
}
function stPill(s) {
  const m = { 'Brouillon': 'grey', 'Ouvert': '', 'Inscriptions closes': 'dark', 'Terminé': 'grey', 'Annulé': 'red' };
  return `<span class="pill ${m[s] ?? 'grey'}">${esc(s || '—')}</span>`;
}
function computeStats() {
  const d = S.admin, act = d.inscriptions.filter(i => i.statut !== 'Annulé');
  const upcoming = d.testings.filter(t => !['Brouillon', 'Annulé'].includes(t.statut) && !isPast(t));
  const fills = upcoming.map(t => [counts(t.id).inscrits, parseInt(t.capacite, 10) || 0]).filter(x => x[1]);
  const fill = fills.length ? Math.round(fills.reduce((s, [a, b]) => s + Math.min(1, a / b), 0) / fills.length * 100) : null;
  const pointed = act.filter(i => i.present === 'oui' || i.present === 'non');
  const presence = pointed.length ? Math.round(pointed.filter(i => i.present === 'oui').length / pointed.length * 100) : null;
  const people = new Map();
  act.forEach(i => { const k = String(i.email).toLowerCase(); const p = people.get(k) || { n: 0, last: i }; p.n++; if (String(i.inscritLe) >= String(p.last.inscritLe)) p.last = i; people.set(k, p); });
  const fideles = [...people.values()].filter(p => p.n >= 2).length;
  const countBy = (arr, f) => { const m = {}; arr.forEach(x => { const k = f(x) || 'Non renseigné'; m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const persons = [...people.values()].map(p => p.last);
  const typeOf = id => (d.testings.find(t => t.id === id) || {}).type;
  const ages = persons.map(p => ageOf(p.dateNaissance)).filter(a => a !== '');
  const ORDRE = ['Moins de 20 ans', '20 à 29 ans', '30 à 39 ans', '40 à 49 ans', '50 à 59 ans', '60 ans et +'];
  const tranche = a => ORDRE[a < 20 ? 0 : a < 30 ? 1 : a < 40 ? 2 : a < 50 ? 3 : a < 60 ? 4 : 5];
  const ageMap = {}; ages.forEach(a => { const k = tranche(a); ageMap[k] = (ageMap[k] || 0) + 1; });
  return {
    upcoming: upcoming.length, inscriptions: act.length, uniques: people.size, fideles, fill, presence,
    byClub: countBy(persons, p => p.club).slice(0, 8),
    byNiveau: countBy(persons, p => p.niveau),
    byType: countBy(act, i => typeOf(i.testingId)),
    top: [...people.values()].sort((a, b) => b.n - a.n).slice(0, 5),
    byAge: ORDRE.filter(k => ageMap[k]).map(k => [k, ageMap[k]]),
    ageMoy: ages.length ? Math.round(ages.reduce((s, a) => s + a, 0) / ages.length) : null,
    ageN: ages.length
  };
}
function hbars(rows) {
  if (!rows.length) return `<div style="color:var(--grey);font-size:13.5px">Pas encore de données.</div>`;
  const max = Math.max(...rows.map(r => r[1]));
  return `<div class="bars">${rows.map(([l, n]) => `<div class="hbar"><span class="lbl" title="${esc(l)}">${esc(l)}</span><span class="trk"><i style="width:${(n / max * 100).toFixed(0)}%"></i></span><span class="num">${n}</span></div>`).join('')}</div>`;
}

        ${hbars(st.byAge)}
      </div>
      <div class="card pad"><div class="h3">Coureurs par club</div>${hbars(st.byClub)}</div>
      <div class="card pad"><div class="h3">Coureurs par niveau</div>${hbars(st.byNiveau)}</div>
      <div class="card pad"><div class="h3">Participations par type</div>${hbars(st.byType)}</div>

        <div style="font-size:13px;color:var(--grey);margin:-6px 0 10px">${plural(st.fideles, 'coureur')} venu${st.fideles > 1 ? 's' : ''} au moins 2 fois</div>
        ${hbars(st.top.map(p => [`${p.last.prenom} ${p.last.nom}`, p.n]))}
      </div>

  }
  const ts = S.admin.testings.slice().sort((a, b) => {

    return pa ? String(b.date).localeCompare(String(a.date)) : String(a.date).localeCompare(String(b.date));

  if (!ts.length) return head + `<div class="card empty"><b>Aucun testing</b>Crée ton premier testing pour ouvrir les inscriptions.</div>`;
  return head + `<div class="list">${ts.map(t => {

    return `<div class="card arow">
      ${dateBlk(t.date)}

        <div class="tags">${stPill(t.statut)}${t.type ? `<span class="pill out">${esc(t.type)}</span>` : ''}${t.collaboration ? `<span class="pill lime">${esc(t.collaboration)}</span>` : ''}</div>
        <b class="t">${esc(t.titre)}</b>
        <div class="meta"><span>${ico('users')}${c.inscrits}${cap ? '/' + cap : ''} inscrits</span>${c.attente ? `<span>${ico('hour')}${c.attente} en attente</span>` : ''}${isPast(t) && (c.presents + c.absents) ? `<span>${ico('check')}${c.presents} présents</span>` : ''}${t.lieu ? `<span>${ico('pin')}${esc(t.lieu)}</span>` : ''}</div>

      </div>
    </div>`;
  }).join('')}</div>`;
}

function canvasBlob(c) { return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Image impossible à générer')), 'image/png')); }
function wrapLines(ctx, text, maxW, maxLines) {
  const words = String(text).split(/\s+/), lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) { lines.length = maxLines; lines[maxLines - 1] = lines[maxLines - 1].replace(/\s*\S*$/, '') + '…'; }
  return lines;
}
async function posterPNG(t) {
  const url = eventUrl(t);
  try { await document.fonts.ready; } catch (e) {}
  const W = 1080, H = 1350, P = 84;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const F = (w, s) => `${w} ${s}px Raleway, "Arial Narrow", Arial, sans-serif`;
  const spacing = v => { try { x.letterSpacing = v; } catch (e) {} };
  x.fillStyle = '#17161D'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#009FE3'; x.fillRect(0, 0, W, 16);
  // marque
  x.textBaseline = 'alphabetic'; spacing('0px');
  x.font = F(800, 40); x.fillStyle = '#FFFFFF'; x.fillText('running', P, 120);
  const w1 = x.measureText('running ').width; x.fillStyle = '#009FE3'; x.fillText('conseil', P + w1, 120);
  spacing('5px'); x.font = F(700, 22); x.fillStyle = '#8D8D96'; x.fillText('RUNNING CLUB AVIGNON', P, 160);
  // titre
  spacing('0px'); x.font = F(900, 66); x.fillStyle = '#FFFFFF';
  let y = 260;
  wrapLines(x, String(t.titre).toUpperCase(), W - 2 * P, 3).forEach(l => { x.fillText(l, P, y); y += 72; });
  x.fillStyle = '#009FE3'; x.fillRect(P, y - 36, 90, 7);
  y += 24;
  spacing('2px'); x.font = F(800, 30); x.fillStyle = '#009FE3';
  const h = horaire(t);
  x.fillText((fmtLong(t.date) + (h ? ' · ' + h : '')).toUpperCase(), P, y);
  if (t.lieu) { spacing('0px'); x.font = `500 30px "Open Sans", Arial, sans-serif`; x.fillStyle = '#B4B4BC'; y += 48; x.fillText(wrapLines(x, t.lieu, W - 2 * P, 1)[0], P, y); }
  // QR
  const n = QR.encode(url).length;
  const box = 560, px = Math.floor((box - 40) / (n + 8)), qrSize = px * (n + 8);
  const bx = (W - qrSize) / 2, by = Math.max(y + 50, H - 300 - qrSize);
  x.fillStyle = '#FFFFFF';
  if (x.roundRect) { x.beginPath(); x.roundRect(bx, by, qrSize, qrSize, 24); x.fill(); } else x.fillRect(bx, by, qrSize, qrSize);
  QR.draw(x, url, bx + 4 * px, by + 4 * px, px);
  // appel à l'action
  x.textAlign = 'center'; spacing('1px');
  x.font = F(900, 50); x.fillStyle = '#FFFFFF'; x.fillText("SCANNE POUR T'INSCRIRE", W / 2, by + qrSize + 92);
  spacing('0px'); x.font = `500 28px "Open Sans", Arial, sans-serif`; x.fillStyle = '#B4B4BC';
  x.fillText('Inscription en 1 minute', W / 2, by + qrSize + 140);
  x.fillStyle = '#009FE3'; x.fillRect(0, H - 16, W, 16);
  return canvasBlob(c);
}
async function qrOnlyPNG(t) {
  const url = eventUrl(t), n = QR.encode(url).length, px = 24, s = (n + 8) * px;
  const c = document.createElement('canvas'); c.width = s; c.height = s;
  const x = c.getContext('2d'); x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, s, s);
  QR.draw(x, url, 4 * px, 4 * px, px);
  return canvasBlob(c);
}

  const stamp = n => addDays(n) + ' 10:00:00';
  const PRENOMS = ['Camille','Lucas','Léa','Hugo','Manon','Nathan','Chloé','Louis','Inès','Jules','Sarah','Mathis','Emma','Théo','Jade','Raphaël','Lina','Arthur','Zoé','Gabriel','Clara','Tom','Anaïs','Enzo','Julie','Maxime','Pauline','Antoine'];

  mk('T-1', 0, 14, 'Inscrit'); mk('T-2', 5, 25, 'Inscrit'); mk('T-2', 2, 3, "Liste d'attente"); mk('T-3', 10, 9, 'Inscrit');
  mk('T-4', 2, 18, 'Inscrit', j => j < 15 ? 'oui' : 'non'); mk('T-5', 8, 12, 'Inscrit', j => j < 11 ? 'oui' : 'non');
  I.find(i => i.testingId === 'T-2' && i.statut === "Liste d'attente").inscritLe = stamp(-1);

  const cnt = id => ({ inscrits: I.filter(i => i.testingId === id && i.statut === 'Inscrit').length, attente: I.filter(i => i.testingId === id && i.statut === "Liste d'attente").length });
  const chk = c => { if (c !== 'demo') throw new Error('Code incorrect (en démo : demo).'); };
  const byDate = (a, b) => (a.date + a.heureDebut).localeCompare(b.date + b.heureDebut);
  const fns = {
    getPublicTestings() { return T.filter(t => t.statut !== 'Brouillon').map(t => { const c = cnt(t.id), cap = +t.capacite || 0; return { ...t, ...c, placesRestantes: cap ? Math.max(0, cap - c.inscrits) : null }; }).sort(byDate); },
    register(p) {
      if (p.website) return { ok: true, statut: 'Inscrit' };
      const t = T.find(x => x.id === p.testingId);
      if (!t || t.statut !== 'Ouvert') throw new Error('Les inscriptions sont fermées pour ce testing.');
      for (const k of ['prenom', 'nom', 'email', 'telephone']) if (!p[k]) throw new Error('Champ obligatoire manquant.');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email)) throw new Error('Adresse email invalide.');
      if (!p.consentRgpd) throw new Error("Merci d'accepter l'utilisation de tes données pour t'inscrire.");
      const email = p.email.toLowerCase();
      if (I.some(i => i.testingId === t.id && i.email.toLowerCase() === email && i.statut !== 'Annulé')) throw new Error('Cette adresse email est déjà inscrite à ce testing.');
      const c = cnt(t.id), cap = +t.capacite || 0, statut = cap && c.inscrits >= cap ? "Liste d'attente" : 'Inscrit';
      I.push({ id: 'I-' + (++seq), testingId: t.id, testingTitre: t.titre, dateTesting: t.date, inscritLe: ymd(new Date()) + ' 12:00:00', prenom: p.prenom, nom: p.nom, email, telephone: p.telephone, dateNaissance: p.dateNaissance || '', club: p.club || '', niveau: p.niveau || '', allure: p.allure || '', pointure: p.pointure || '', commentaire: p.commentaire || '', consentRgpd: 'oui', consentPhoto: p.consentPhoto ? 'oui' : 'non', statut, present: '' });
      return { ok: true, statut, position: statut === 'Inscrit' ? null : c.attente + 1 };
    },
    adminGetData(code) { chk(code); return { testings: T.slice().sort(byDate), inscriptions: I }; },
    adminSaveTesting(code, t) {
      chk(code);
      if (!t.titre || !t.date) throw new Error('Le titre et la date sont obligatoires.');
      if (t.id) { const ex = T.find(x => x.id === t.id); Object.assign(ex, t, { modifieLe: stamp(0) }); I.filter(i => i.testingId === t.id).forEach(i => { i.testingTitre = t.titre; i.dateTesting = t.date; }); }
      else T.push({ ...base, ...t, id: 'T-' + (T.length + 1) + '-' + Date.now().toString(36), creeLe: stamp(0), modifieLe: stamp(0) });
      return fns.adminGetData(code);
    },
    adminUpdateInscription(code, id, ch) {
      chk(code);
      const ex = I.find(i => i.id === id); const before = ex.statut; Object.assign(ex, ch); let promoted = null;
      if (before === 'Inscrit' && ch.statut && ch.statut !== 'Inscrit') {
        const t = T.find(x => x.id === ex.testingId), cap = +t.capacite || 0;
        if (!cap || cnt(t.id).inscrits < cap) {
          const nx = I.filter(i => i.testingId === t.id && i.statut === "Liste d'attente").sort((a, b) => a.inscritLe.localeCompare(b.inscritLe))[0];
          if (nx) { nx.statut = 'Inscrit'; promoted = nx.prenom + ' ' + nx.nom; }
        }
      }
      return { data: fns.adminGetData(code), promoted };
    },
    /* --- Membres (démo) --- */
    membresPublicTestings(tok) {
      const ok = memberOf(tok), now = Date.now();
      return fns.getPublicTestings().map(t => { const e = E[t.id]; return e && e.avantPremiere === 'oui' && e.ouverturePublic && new Date(e.ouverturePublic).getTime() > now ? { ...t, avantPremiere: true, ouverturePublic: e.ouverturePublic, verrouille: !ok } : t; });
    },
    membresSubscribe(p) {
      if (p.website) return { ok: true };
      const email = String(p.email || '').trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('Adresse e-mail invalide.');
      if (!p.consentRgpd) throw new Error("Merci d'accepter les conditions pour devenir membre.");
      let m = M.find(x => x.email === email);
      if (m && m.statut === 'Actif') { Object.keys(PROF).forEach(k => { if (!m[k] && p[k]) m[k] = p[k]; }); return { ok: true, demoToken: m.token }; }
      if (!m) { m = { token: 'demo-' + Math.random().toString(36).slice(2, 10), statut: 'En attente', creeLe: stamp(0), confirmeLe: '', email }; M.push(m); }
      Object.keys(PROF).forEach(k => { if (p[k] !== undefined && k !== 'email') m[k] = k === 'consentPhoto' ? (p[k] ? 'oui' : 'non') : p[k]; });
      return { ok: true, demoToken: m.token };
    },
    membresConfirm(tok) { const m = M.find(x => x.token === tok); if (!m) throw new Error('Lien invalide ou expiré.'); if (m.statut !== 'Actif') { m.statut = 'Actif'; m.confirmeLe = stamp(0); } return pub(m); },
    membresMe(tok) { return pub(active(tok)); },
    membresSendLink(email) { const m = M.find(x => x.email === String(email).trim().toLowerCase() && x.statut === 'Actif'); return { ok: true, demoToken: m ? m.token : '' }; },
    membresUpdate(tok, p) { const m = active(tok); Object.keys(PROF).forEach(k => { if (k !== 'email' && p[k] !== undefined) m[k] = k === 'consentPhoto' ? (p[k] ? 'oui' : 'non') : p[k]; }); return pub(m); },
    membresUnsubscribe(tok) { const k = M.findIndex(x => x.token === tok); if (k < 0) throw new Error('Lien invalide ou déjà utilisé.'); M.splice(k, 1); return { ok: true }; },
    membresRegister(tok, testingId, x) {
      const m = active(tok);
      Object.keys(PROF).forEach(k => { if (k !== 'email' && x[k] !== undefined && x[k] !== '') m[k] = k === 'consentPhoto' ? (x[k] ? 'oui' : 'non') : x[k]; });
      const t = T.find(y => y.id === testingId); if (!t || t.statut !== 'Ouvert') throw new Error('Les inscriptions sont fermées pour ce testing.');
      return fns.register({ testingId, prenom: m.prenom, nom: m.nom, email: m.email, telephone: m.telephone, dateNaissance: m.dateNaissance, club: m.club, niveau: m.niveau, allure: m.allure, pointure: x.pointure || m.pointure, commentaire: x.commentaire || '', consentRgpd: true, consentPhoto: !!x.consentPhoto });
    },
    membresAdminSync(code, id, o) {
      chk(code); const t = T.find(x => x.id === id); if (!t) throw new Error('Testing introuvable.');
      let e = E[id]; if (!e) e = E[id] = { testingId: id };
      if (!e.ouvertureMembres) { e.avantPremiere = o.avantPremiere ? 'oui' : 'non'; e.notifier = o.notifier ? 'oui' : 'non'; }
      if (t.statut !== 'Ouvert' || e.ouvertureMembres) return { ok: true, message: '' };
      const now = new Date(); e.ouvertureMembres = now.toISOString(); e.ouverturePublic = new Date(now.getTime() + (e.avantPremiere === 'oui' ? 24 * 3600e3 : 0)).toISOString();
      const n = M.filter(m => m.statut === 'Actif').length;
      return { ok: true, message: [e.notifier === 'oui' ? `${n} membre(s) prévenu(s) par e-mail (démo : aucun e-mail réel).` : '', e.avantPremiere === 'oui' ? 'Avant-première membres pendant 24 h.' : ''].filter(Boolean).join(' ') };
    },
    membresAdminData(code) {
      chk(code);
      return { config: { avantPremiereH: 24, objectif: OBJ }, quota: 100, fileAttente: 0, events: Object.values(E),
        membres: M.map(m => ({ ...m, token: undefined, participations: pres(m.email), bons: B.filter(b => b.email === m.email).length })), bons: B };
    },
    membresAdminTick(code) { chk(code); return { ok: true, message: 'Démo : file vide, aucun e-mail à envoyer.' }; },
    membresAdminBonUtilise(code, c) { chk(code); const b = B.find(x => x.code === c); if (b) b.utiliseLe = stamp(0); return fns.membresAdminData(code); }
  };
  const OBJ = 5;
  const PROF = { prenom: 1, nom: 1, email: 1, telephone: 1, dateNaissance: 1, club: 1, niveau: 1, allure: 1, pointure: 1, consentPhoto: 1 };
  const pres = email => I.filter(i => String(i.email).toLowerCase() === email && i.present === 'oui').length;
  const pub = m => { const n = pres(m.email), bons = B.filter(b => b.email === m.email); return { statut: m.statut, prenom: m.prenom || '', nom: m.nom || '', email: m.email, telephone: m.telephone || '', dateNaissance: m.dateNaissance || '', club: m.club || '', niveau: m.niveau || '', allure: m.allure || '', pointure: m.pointure || '', consentPhoto: m.consentPhoto || '', inscrits: I.filter(i => String(i.email).toLowerCase() === m.email && i.statut !== 'Annulé').map(i => i.testingId), fidelite: { participations: n, objectif: OBJ, recompense: '20 €', bons: bons.map(b => ({ code: b.code, creeLe: b.creeLe, utiliseLe: b.utiliseLe })), bonsDisponibles: bons.filter(b => !b.utiliseLe).map(b => b.code) } }; };
  const memberOf = tok => M.find(x => x.token === tok && x.statut === 'Actif');
  const active = tok => { const m = memberOf(tok); if (!m) throw new Error('Lien membre invalide ou expiré : reconnecte-toi.'); return m; };
  const P8 = POOL[8];
  const M = [{ token: 'demo-membre', statut: 'Actif', creeLe: stamp(-50), confirmeLe: stamp(-50), ...P8, consentPhoto: 'oui' }];
  const B = [];
  const E = { 'T-1': { testingId: 'T-1', avantPremiere: 'oui', notifier: 'oui', ouvertureMembres: new Date(Date.now() - 4 * 3600e3).toISOString(), ouverturePublic: new Date(Date.now() + 20 * 3600e3).toISOString() } };
  return { call(fn, args) { return new Promise((res, rej) => setTimeout(() => { try { res(JSON.parse(JSON.stringify(fns[fn](...args)))); } catch (e) { rej(e); } }, 200)); } };
})();

/* Démarrage */
if (!IS_GAS && !CONFIG.apiUrl) document.getElementById('demo').hidden = false;
render();
function readParams() {
  return new Promise(res => {
    if (IS_GAS && google.script.url) google.script.url.getLocation(l => res((l && l.parameter) || {}));
    else { try { res(Object.fromEntries(new URLSearchParams(location.search))); } catch (e) { res({}); } }
  });
}
(async () => {
  const [prm] = await Promise.all([readParams(), initAppUrl()]);
  const deep = prm.t || '';
  if ((prm.m || prm.confirm || prm.unsub) && !IS_GAS && history.replaceState) {
    try { history.replaceState(null, '', location.pathname + (deep ? '?t=' + encodeURIComponent(deep) : '') + location.hash); } catch (e) {}
  }
  if (prm.m) { S.mTok = prm.m; store.set(MTOK, prm.m); }
  if (prm.confirm) {
    try { const m = await api('membresConfirm', prm.confirm); setMember(prm.confirm, m); toast(`Bienvenue au club, ${m.prenom} ! Ton compte membre est activé.`); }
    catch (e) { toast(errMsg(e), true); }
  }
  await Promise.all([loadMember(), loadPublic()]);
  if (prm.unsub) return go('unsub', { unsubTok: prm.unsub, unsubDone: false });
  if (deep) {
    const t = S.testings.find(x => x.id === deep);
    if (t) go(canRegister(t) ? 'form' : 'detail', { currentId: t.id, deep });
    else toast("Ce testing n'est plus disponible.", true);
  }
})();
})();
</script>
